name: RetroBooth - Build Windows EXE
on:
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: Also build Windows ARM64 (requires separate ARM64 device acceptance)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: retrobooth-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows EXE (${{ matrix.arch }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.windows_arm64 && '["x64","arm64"]' || '["x64"]') }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Repository preflight and fast source checks
        run: |
          git ls-files --error-unmatch src/.htaccess src/desktop-admin.html tools/prepare-desktop.mjs tools/verify-repository.py
          npm run desktop:prepare
          npm test
          python tools/verify-repository.py
      - name: Install pinned desktop tooling
        run: npm run desktop:install
      - name: Actual Electron runtime smoke (isolated profile, fake camera)
        run: node tools/run-desktop-smoke.mjs
      - name: Build Windows installer and portable EXE
        run: npm --prefix desktop run package:win:${{ matrix.arch }}
      - name: Test actual packaged x64 application
        if: ${{ matrix.arch == 'x64' }}
        run: node tools/run-desktop-smoke.mjs desktop/release/win-unpacked/RetroBooth.exe
      - name: Collect programs and hashes
        run: node tools/collect-windows.mjs ${{ matrix.arch }}
      - name: Upload Windows programs
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Windows-${{ matrix.arch }}-EXE-v0.9.6-${{ github.run_number }}
          path: windows-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Windows build evidence and resolved lockfile
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Windows-${{ matrix.arch }}-Evidence-${{ github.run_number }}
          include-hidden-files: true
          path: |
            desktop/.smoke-output/
            desktop/package-lock.json
            desktop/release/builder-debug.yml
            desktop/release/builder-effective-config.yaml
          if-no-files-found: warn
          retention-days: 14
