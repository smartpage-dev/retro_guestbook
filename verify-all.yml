name: RetroBooth - Full Verification
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retrobooth-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    name: Verify source, browser and private-cloud flow
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Confirm v0.9 Verify timeout patch is in this checkout
        run: |
          echo "RetroBooth CI profile: independent-full-verify-75min / 2026-11-24"
          echo "Git commit: $(git rev-parse HEAD)"
          python - <<'PYVERIFY'
          from pathlib import Path
          import re
          text = Path('.github/workflows/verify-all.yml').read_text()
          block = text.split('  verify:', 1)[1].split('  android:', 1)[0]
          match = re.search(r'^    timeout-minutes: (\d+)\s*$', block, re.M)
          assert match and int(match.group(1)) >= 75, 'Verify job timeout patch missing from checkout'
          print('Verify job timeout in committed workflow:', match.group(1), 'minutes')
          PYVERIFY
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare assets and run unit contracts
        run: |
          python tools/check_release_versions.py
          npm run desktop:prepare
          npm test
          npm run test:native-core
          python tools/verify-repository.py
      - name: PHP private-cloud integration
        run: |
          # The Ubuntu regional apt mirror stalled for ~26 minutes in run 45317047663.
          # Bound per-request waits and allow apt to fall back to its other mirrors.
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/90-retrobooth-ci >/dev/null
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends php-cli ffmpeg
          php -r 'exit(PHP_VERSION_ID >= 80200 ? 0 : 1);'
          find cloud -name '*.php' -print0 | xargs -0 -n 1 php -l
          python tests/cloud_api.py
      - name: Install browser test tools
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Browser regressions and real-origin persistence
        run: |
          python tests/run_suite.py
          python tests/browser_v09.py
          python tests/real_origin.py --require-origin
          python tests/cloud_real_origin.py
      - name: Build optional web and hosting distributions
        run: npm run package:web
      - name: Upload web distributions
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Web-v0.9.6-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Test-Evidence-${{ github.run_number }}
          path: |
            qa/*.json
            qa/*.log
            qa/*.png
          if-no-files-found: warn
          retention-days: 14
