name: RetroBooth - Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retrobooth-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      RETRO_TEST_STORE_PASSWORD: ${{ secrets.RETRO_TEST_STORE_PASSWORD }}
      RETRO_TEST_KEY_ALIAS: ${{ secrets.RETRO_TEST_KEY_ALIAS }}
      RETRO_TEST_KEY_PASSWORD: ${{ secrets.RETRO_TEST_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Repository preflight and fast source checks
        run: |
          git ls-files --error-unmatch src/.htaccess src/desktop-admin.html tools/prepare-desktop.mjs tools/verify-repository.py
          npm run desktop:prepare
          npm test
          npm run test:native-core
          python tools/verify-repository.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-disabled: true
      - name: Install the Android SDK packages
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Configure optional stable TEST signing
        env:
          KEY_B64: ${{ secrets.RETRO_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            test -n "$RETRO_TEST_STORE_PASSWORD" || { echo 'Missing RETRO_TEST_STORE_PASSWORD'; exit 1; }
            test -n "$RETRO_TEST_KEY_ALIAS" || { echo 'Missing RETRO_TEST_KEY_ALIAS'; exit 1; }
            test -n "$RETRO_TEST_KEY_PASSWORD" || { echo 'Missing RETRO_TEST_KEY_PASSWORD'; exit 1; }
            printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/retro-test.jks"
            chmod 600 "$RUNNER_TEMP/retro-test.jks"
            echo "RETRO_TEST_KEYSTORE_PATH=$RUNNER_TEMP/retro-test.jks" >> "$GITHUB_ENV"
            echo "SIGNING_MODE=persistent-test-key" >> "$GITHUB_ENV"
          else
            if [ -n "$RETRO_TEST_STORE_PASSWORD$RETRO_TEST_KEY_ALIAS$RETRO_TEST_KEY_PASSWORD" ]; then
              echo 'Partial signing secrets: supply all four secrets or remove all four.'; exit 1
            fi
            echo '::warning::Temporary debug signing: later builds may not update this APK. Set all four RETRO_TEST secrets before retaining valuable recordings.'
            echo "SIGNING_MODE=ephemeral-debug-key" >> "$GITHUB_ENV"
          fi
      - name: Compile Android and run native lint
        run: |
          npm run android:assets
          gradle -p android --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:lintDebug --stacktrace
      - name: Verify signed test APK and collect outputs
        run: |
          mkdir -p native-artifacts unsigned-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk native-artifacts/RetroBooth-v0.9.1-Android-TEST.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs native-artifacts/RetroBooth-v0.9.1-Android-TEST.apk > native-artifacts/SIGNATURE.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging native-artifacts/RetroBooth-v0.9.1-Android-TEST.apk > native-artifacts/APK_INFO.txt
          grep "name='studio.luce.retrobooth.preview'" native-artifacts/APK_INFO.txt
          grep "versionCode='10'" native-artifacts/APK_INFO.txt
          python tools/native_build_info.py
          cp docs/ANDROID_QUICK_START.md native-artifacts/READ_ME_FIRST.md
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk unsigned-artifacts/RetroBooth-v0.9.1-UNSIGNED.apk
          cp android/app/build/outputs/bundle/release/app-release.aab unsigned-artifacts/RetroBooth-v0.9.1-UNSIGNED.aab
          cd native-artifacts
          sha256sum *.apk *.json > SHA256SUMS.txt
      - name: Upload installable TEST APK
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Android-APK-v0.9.1-${{ github.run_number }}
          path: native-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned developer files (not installable)
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-UNSIGNED-DEVELOPER-FILES-v0.9.1-${{ github.run_number }}
          path: unsigned-artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android lint/build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: RetroBooth-Android-Evidence-${{ github.run_number }}
          path: android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/retro-test.jks"
