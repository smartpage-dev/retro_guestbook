plugins { id 'com.android.application' }
android {
    namespace 'studio.luce.retrobooth'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.luce.retrobooth.preview'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '0.9.2-alpha.1'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        debug {
            if (System.getenv('RETRO_TEST_KEYSTORE_PATH')) {
                storeFile file(System.getenv('RETRO_TEST_KEYSTORE_PATH'))
                storePassword System.getenv('RETRO_TEST_STORE_PASSWORD')
                keyAlias System.getenv('RETRO_TEST_KEY_ALIAS')
                keyPassword System.getenv('RETRO_TEST_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false } // Deliberately UNSIGNED; not a store release.
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
